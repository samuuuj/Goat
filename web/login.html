<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Goat · Entrar</title>
    <meta name="description" content="Tu asistente diario." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Goat" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="img/icono-512.png" type="image/png" />
    <link rel="apple-touch-icon" href="img/icono-180.png" />
    <link rel="preload" href="fuentes/archivo.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/login.css" />
    <script src="js/vendor/supabase.js" defer></script>
    <script type="module" src="js/paginas/login.js"></script>
  </head>

  <body class="grano">
    <main class="login">
      <!-- Luz naranja que flota lenta detrás de todo. -->
      <div class="resplandor" aria-hidden="true"></div>

      <!-- Marca -->
      <section class="login-marca">
        <div class="login-barra">
          <p class="etiqueta">Goat · v0.3</p>
          <p class="etiqueta con-icono">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <rect x="4" y="11" width="16" height="10" rx="2.5" />
              <path d="M8 11V7a4 4 0 0 1 8 0v4" />
            </svg>
            Privado
          </p>
        </div>

        <div class="login-titulo">
          <p class="etiqueta login-lema">Tu asistente diario</p>
          <h1 id="marca" aria-label="Goat">
            <span class="linea-marca" data-linea="Goat." aria-hidden="true">
              <span class="titular">Goat<span class="acento">.</span></span>
            </span>
          </h1>
          <!-- Frase que cambia sola: lo que hace la app en cuatro verbos (js/paginas/login.js). -->
          <p class="titular rotador" id="rotador" aria-hidden="true"><span>Registra.</span></p>
        </div>
      </section>

      <!-- Formulario -->
      <section class="login-formulario">
        <form id="formulario" method="post" novalidate>
          <div class="aparece">
            <label class="campo">
              <span class="etiqueta">Correo</span>
              <input
                id="correo"
                name="correo"
                type="email"
                inputmode="email"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
                maxlength="254"
                required
                placeholder="tu@correo.com"
              />
            </label>
          </div>

          <div class="aparece">
            <label class="campo" for="contrasena"><span class="etiqueta">Contraseña</span></label>
            <div class="campo-clave">
              <input
                id="contrasena"
                name="contrasena"
                type="password"
                autocomplete="current-password"
                maxlength="200"
                required
                placeholder="••••••••"
              />
              <button type="button" id="ver-clave" class="boton-ojo" aria-label="Mostrar contraseña" aria-pressed="false">
                <svg class="ojo" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="3" />
                  <path class="tachado" d="M4 4l16 16" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Interruptor estilo iOS: con sesión guardada no vuelve a pedir la clave en este dispositivo. -->
          <div class="aparece">
            <button type="button" id="recordar" class="interruptor" role="switch" aria-checked="true">
              <span>
                <span class="interruptor-titulo">Mantener sesión iniciada</span>
                <span class="interruptor-detalle" id="recordar-detalle">No te pedirá la clave en este dispositivo.</span>
              </span>
              <span class="interruptor-pista" aria-hidden="true"><span class="interruptor-bolita"></span></span>
            </button>
          </div>

          <div class="aparece">
            <button type="submit" id="entrar" class="boton-principal boton-entrar" disabled>
              <span class="girando" aria-hidden="true"></span>
              <span id="entrar-texto">Entrar</span>
              <span class="flecha" aria-hidden="true">→</span>
            </button>
          </div>

          <div class="login-error" aria-live="polite">
            <p id="error" hidden></p>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
